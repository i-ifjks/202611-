<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>現場掲示用QRコード作成</title><style>body{font-family:system-ui,sans-serif;max-width:620px;margin:40px auto;padding:0 18px;color:#20312e}label{display:block;font-weight:700;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #9aaba5;border-radius:8px;font-size:16px}button{margin-top:12px;padding:12px 16px;background:#174c46;color:white;border:0;border-radius:8px;font-weight:700;font-size:16px}#result{margin-top:24px}#result img{max-width:260px}small{color:#52635e}</style></head>
<body><h1>現場掲示用QRコード</h1><p>サイトを公開した後、公開URLを入力してQRコードを作成してください。</p><label for="url">公開URL</label><input id="url" type="url" placeholder="https://公開済みサイトのURL/" required><button id="make">QRコードを表示</button><div id="result" aria-live="polite"></div><small>公開URLを確定する前にQRコードを掲示しないでください。生成画像は右クリックまたは長押しで保存できます。</small><script>document.getElementById('make').addEventListener('click',()=>{const value=document.getElementById('url').value.trim();const out=document.getElementById('result');out.replaceChildren();try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol))throw new Error();const img=document.createElement('img');img.alt='入力された公開URLのQRコード';img.src='https://api.qrserver.com/v1/create-qr-code/?size=640x640&format=png&data='+encodeURIComponent(u.href);out.append(img);const p=document.createElement('p');p.textContent=u.href;out.append(p)}catch{out.textContent='有効な公開URL（https://...）を入力してください。'}});</script></body></html>
